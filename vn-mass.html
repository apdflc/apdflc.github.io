hục vụ · APDFLC 2026</div> <div class="t3" id="t-upd">Cập nhật 19/10/2026, 18:06 (UTC+7)</div> </div> </div> <div class="tools" role="group" aria-label="Cỡ chữ"> <button class="tbtn" id="fs-down" type="button" aria-label="Chữ nhỏ hơn">A−</button> <button class="tbtn" id="fs-up" type="button" aria-label="Chữ lớn hơn">A+</button> </div> </header> <nav class="bar" aria-label="Các ngày"> <div class="bar-in"> <div class="chips" id="days"></div> </div> </nav> <nav class="secbar" id="secbar" aria-label="Các phần Thánh lễ"><div class="secbar-in" id="secbar-in"></div></nav> <main> <div class="dayline" id="dayline"></div> <article class="sheet" id="sheet"></article> </main> <button class="totop" id="totop" type="button" aria-label="Lên đầu trang">↑</button> <footer class="foot"> <span class="motto">Laudare · Benedicere · Praedicare</span> <a class="backlink" href="liturgy.html">Holy Mass &amp; Liturgy of the Hours (English)</a> <a class="backlink" href="./">Conference programme</a> <span class="credit">Thiết kế: Ban Phụng vụ · Gia đình Đa Minh Việt Nam</span> </footer> <script>(()=>{const n=[{date:"2026-10-24",chip:"T7",dow:"Thứ Bảy",title:"Thứ Bảy Tuần XXIX Thường Niên",color:"green",rank:"Lễ ngày thường · Năm chẵn",gloria:!1,credo:!1,ent:{ref:"Tv 16,6.8",text:"Con kêu lên Ngài, lạy Thiên Chúa,\nvì Ngài đáp lời con,\nxin lắng tai và nghe tiếng con cầu.\nXin giữ gìn con như thể con ngươi,\ndưới bóng Ngài, xin thương che chở."},comm:[{ref:"Tv 32,18-19",text:"Chúa để mắt trông nom người kính sợ Chúa,\nkẻ trông cậy vào lòng Chúa yêu thương,\nhầu cứu họ khỏi tay thần chết\nvà nuôi dưỡng trong buổi cơ hàn."},{ref:"Mc 10,45",text:"Con Người đến để hiến dâng mạng sống\nlàm giá chuộc muôn người."}],reads:[{kind:"first",label:"Bài đọc",ref:"Ep 4,7-16",inc:"Đức Ki-tô là Đầu. Chính Người làm cho toàn thân lớn lên.",lead:"Bài trích thư của thánh Phao-lô tông đồ gửi tín hữu Ê-phê-xô.",paras:["⟦7⟧ Thưa anh em, mỗi người chúng ta đã nhận được ân sủng tuỳ theo mức độ Đức Ki-tô ban cho. ⟦8⟧ Vì thế, có lời Kinh Thánh nói : Người đã lên cao, dẫn theo một đám tù ; Người đã ban ân huệ cho loài người.","⟦9⟧ Người đã lên nghĩa là gì, nếu không phải là Người đã xuống tận các vùng sâu thẳm dưới mặt đất ? ⟦10⟧ Đấng đã xuống cũng chính là Đấng đã lên cao hơn mọi tầng trời để làm cho vũ trụ được viên mãn. ⟦11⟧ Và chính Người đã ban ơn cho kẻ này làm Tông Đồ, người nọ làm ngôn sứ, kẻ khác làm người loan báo Tin Mừng, kẻ khác nữa làm người coi sóc và dạy dỗ. ⟦12⟧ Nhờ đó, dân thánh được chuẩn bị để làm công việc phục vụ, là xây dựng thân thể Đức Ki-tô, ⟦13⟧ cho đến khi tất cả chúng ta đạt tới sự hiệp nhất trong đức tin và trong sự nhận biết Con Thiên Chúa, tới tình trạng con người trưởng thành, tới tầm vóc viên mãn của Đức Ki-tô.","⟦14⟧ Như vậy, chúng ta sẽ không còn là những trẻ nhỏ, bị sóng đánh trôi giạt theo mọi chiều gió đạo lý, giữa trò bịp bợm của những kẻ giảo quyệt khéo dùng mưu ma chước quỷ để làm cho kẻ khác lầm đường. ⟦15⟧ Nhưng, sống theo sự thật và trong tình bác ái, chúng ta sẽ lớn lên về mọi phương diện, vươn tới Đức Ki-tô vì Người là Đầu. ⟦16⟧ Chính Người làm cho các bộ phận ăn khớp với nhau và toàn thân được kết cấu chặt chẽ, nhờ mọi thứ gân mạch nuôi dưỡng và mỗi chi thể hoạt động theo chức năng của mình. Như thế Người làm cho toàn thân lớn lên và được xây dựng trong tình bác ái."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 121,1-2.3-4a.4b-5 (Đ. x. c.1)",refrain:"Ta vui mừng trẩy lên đền thánh Chúa.",stanzas:["⟦1⟧Vui dường nào khi thiên hạ bảo tôi :\n“Ta cùng trẩy lên đền thánh Chúa !”\nVà giờ đây, Giê-ru-sa-lem hỡi,\n⟦2⟧cửa nội thành, ta đã dừng chân.","⟦3⟧Giê-ru-sa-lem khác nào đô thị\nđược xây nên một khối vẹn toàn.\n⟦4a⟧Từng chi tộc, chi tộc của Chúa,\ntrẩy hội lên đền ở nơi đây.","⟦4b⟧Để danh Chúa, họ cùng xưng tụng,\nnhư lệnh đã truyền cho Ít-ra-en.\n⟦5⟧Cũng nơi đó, đặt ngai xét xử,\nngai vàng của vương triều Đa-vít."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"Ed 33,11",text:"Ha-lê-lui-a. Ha-lê-lui-a. Đức Chúa phán : “Ta chẳng vui gì khi kẻ gian ác phải chết, nhưng vui khi nó thay đổi đường lối để được sống.” Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Lc 13,1-9",inc:"Nếu các ông không chịu sám hối, thì các ông cũng sẽ chết hết y như vậy.",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Lu-ca.",paras:["⟦1⟧ Lúc ấy, có mấy người đến kể lại cho Đức Giê-su nghe chuyện những người Ga-li-lê bị tổng trấn Phi-la-tô giết, khiến máu đổ ra hoà lẫn với máu tế vật họ đang dâng. ⟦2⟧ Đức Giê-su đáp lại rằng : “Các ông tưởng mấy người Ga-li-lê này phải chịu số phận đó vì họ tội lỗi hơn mọi người Ga-li-lê khác sao ? ⟦3⟧ Tôi nói cho các ông biết : không phải thế đâu ; nhưng nếu các ông không sám hối, thì các ông cũng sẽ chết hết như vậy. ⟦4⟧ Cũng như mười tám người kia bị tháp Si-lô-ác đổ xuống đè chết, các ông tưởng họ là những người mắc tội nặng hơn tất cả mọi người ở thành Giê-ru-sa-lem sao ? ⟦5⟧ Tôi nói cho các ông biết : không phải thế đâu ; nhưng nếu các ông không chịu sám hối, thì các ông cũng sẽ chết hết y như vậy.”","⟦6⟧ Rồi Đức Giê-su kể dụ ngôn này : “Người kia có một cây vả trồng trong vườn nho mình. Bác ta ra cây tìm trái mà không thấy, ⟦7⟧ nên bảo người làm vườn : ‘Anh coi, đã ba năm nay tôi ra cây vả này tìm trái, mà không thấy. Vậy anh chặt nó đi, để làm gì cho hại đất ?’ ⟦8⟧ Nhưng người làm vườn đáp : ‘Thưa ông, xin cứ để nó lại năm nay nữa. Tôi sẽ vun xới chung quanh, và bón phân cho nó. ⟦9⟧ May ra sang năm nó có trái, nếu không thì ông sẽ chặt nó đi’.”"]}]},{date:"2026-10-25",chip:"CN",dow:"Chúa Nhật",title:"Chúa Nhật XXX Thường Niên",color:"green",rank:"Chúa Nhật · Năm A",gloria:!0,credo:!0,ent:{ref:"Tv 104,3-4",text:"Tâm hồn những ai tìm kiếm Chúa,\nnào hoan hỷ.\nHãy tìm Chúa và sức mạnh của Người,\nchẳng khi ngừng tìm kiếm Thánh Nhan."},comm:[{ref:"Tv 19,6",text:"Chúng ta hãy vui mừng vì ơn Chúa cứu độ,\nphất cao cờ mừng danh Chúa chúng ta."},{ref:"Ep 5,2",text:"Đức Ki-tô đã yêu thương chúng ta,\nvà vì chúng ta,\nđã tự nộp mình làm hiến lễ dâng lên Thiên Chúa,\ntựa hương thơm ngào ngạt."}],reads:[{kind:"first",label:"Bài đọc I",ref:"Xh 22,20-26",inc:"Nếu các ngươi ức hiếp mẹ goá con côi, thì cơn giận Ta sẽ bốc lên chống lại các ngươi.",lead:"Bài trích sách Xuất hành.",paras:["⟦20⟧ Đức Chúa phán thế này : Người ngoại kiều, ngươi không được ngược đãi và áp bức, vì chính các ngươi đã là ngoại kiều ở đất Ai-cập. ⟦21⟧ Mẹ goá con côi, các ngươi không được ức hiếp. ⟦22⟧ Nếu ngươi ức hiếp mà nó kêu cứu Ta, ắt Ta sẽ nghe tiếng nó kêu cứu. ⟦23⟧ Cơn giận Ta sẽ bốc lên, Ta sẽ cho gươm chém giết các ngươi : thế là vợ các ngươi sẽ thành goá bụa, và con các ngươi sẽ thành côi cút.","⟦24⟧ Nếu ngươi cho một người trong dân Ta, một người nghèo ở với ngươi vay tiền, thì ngươi không được xử với nó như chủ nợ, không được bắt nó trả lãi.","⟦25⟧ Nếu ngươi giữ áo choàng của người khác làm đồ cầm, thì ngươi phải trả lại cho nó trước khi mặt trời lặn. ⟦26⟧ Nó chỉ có cái đó để đắp, để làm áo che thân ; nó sẽ lấy gì mà ngủ ? Nó mà kêu cứu Ta, Ta sẽ nghe nó, vì Ta vốn nhân từ."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 17,2-3a.3bc-4.47 và 51ab (Đ. c.2)",refrain:"Con yêu mến Ngài,\nlạy Chúa là sức mạnh của con.",stanzas:["⟦2⟧Con yêu mến Ngài,\nlạy Chúa là sức mạnh của con ;\n⟦3a⟧lạy Chúa là núi đá, là thành luỹ,\nlà Đấng giải thoát con.","⟦3bc⟧Lạy Thiên Chúa con thờ, là núi đá cho con trú ẩn,\nlà khiên mộc, là Đấng cứu độ quyền năng,\nlà thành trì bảo vệ.\n⟦4⟧Tôi kêu cầu Chúa\nlà Đấng xứng muôn lời ngợi khen,\nvà tôi được cứu thoát khỏi quân thù.","⟦47⟧Đức Chúa vạn vạn tuế !\nChúc tụng Người là núi đá cho tôi trú ẩn.\nTôn vinh Thiên Chúa là Đấng cứu độ tôi,\n⟦51ab⟧Chúa ban nhiều chiến thắng lớn lao\ncho Đức Vua chính Người đã lập."]},{kind:"second",label:"Bài đọc II",ref:"1 Tx 1,5c-10",inc:"Anh em đã từ bỏ ngẫu tượng, để phụng sự Thiên Chúa và chờ đợi Con của Người.",lead:"Bài trích thư thứ nhất của thánh Phao-lô tông đồ gửi tín hữu Thê-xa-lô-ni-ca.",paras:["⟦5c⟧ Thưa anh em, anh em biết, khi ở với anh em, chúng tôi đã sống thế nào để mưu ích cho anh em ; ⟦6⟧ còn anh em, anh em đã bắt chước chúng tôi và noi gương Chúa, khi đón nhận lời Chúa giữa bao nỗi gian truân với niềm vui do Thánh Thần ban : ⟦7⟧ bởi vậy anh em đã nên gương cho mọi tín hữu ở miền Ma-kê-đô-ni-a và miền A-khai-a. ⟦8⟧ Quả thế, từ nơi anh em, lời Chúa đã vang ra, không những ở Ma-kê-đô-ni-a và A-khai-a, mà đâu đâu người ta cũng nghe biết lòng tin anh em đặt vào Thiên Chúa, khiến chúng tôi không cần phải nói gì thêm nữa. ⟦9⟧ Khi nói về chúng tôi, người ta kể lại chúng tôi đã được anh em tiếp đón làm sao, và anh em đã từ bỏ ngẫu tượng mà quay về với Thiên Chúa thế nào, để phụng sự Thiên Chúa hằng sống, Thiên Chúa thật, ⟦10⟧ và chờ đợi Con của Người từ trời ngự đến, người Con mà Thiên Chúa đã cho trỗi dậy từ cõi chết, là Đức Giê-su, Đấng cứu chúng ta thoát cơn thịnh nộ đang đến."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"Ga 14,23",text:"Ha-lê-lui-a. Ha-lê-lui-a. Chúa nói : “Ai yêu mến Thầy, thì sẽ giữ lời Thầy. Cha Thầy sẽ yêu mến người ấy. Cha Thầy và Thầy sẽ đến với người ấy.” Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Mt 22,34-40",inc:"Ngươi phải yêu mến Đức Chúa, Thiên Chúa của ngươi, và yêu người thân cận như chính mình.",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Mát-thêu.",paras:["⟦34⟧ Khi ấy, nghe tin Đức Giê-su đã làm cho nhóm Xa-đốc phải câm miệng, thì những người Pha-ri-sêu họp nhau lại. ⟦35⟧ Rồi một người thông luật trong nhóm hỏi Đức Giê-su để thử Người rằng : ⟦36⟧ “Thưa Thầy, trong sách Luật Mô-sê, điều răn nào là điều răn trọng nhất ?” ⟦37⟧ Đức Giê-su đáp : “Ngươi phải yêu mến Đức Chúa, Thiên Chúa của ngươi, hết lòng, hết linh hồn và hết trí khôn ngươi. ⟦38⟧ Đó là điều răn trọng nhất và điều răn thứ nhất. ⟦39⟧ Còn điều răn thứ hai, cũng giống điều răn ấy, là : Ngươi phải yêu người thân cận như chính mình. ⟦40⟧ Tất cả Luật Mô-sê và các sách ngôn sứ đều tuỳ thuộc vào hai điều răn ấy.”"]}]},{date:"2026-10-26",chip:"T2",dow:"Thứ Hai",title:"Thứ Hai Tuần XXX Thường Niên",color:"green",rank:"Lễ ngày thường · Năm chẵn",gloria:!1,credo:!1,ent:{ref:"Tv 104,3-4",text:"Tâm hồn những ai tìm kiếm Chúa,\nnào hoan hỷ.\nHãy tìm Chúa và sức mạnh của Người,\nchẳng khi ngừng tìm kiếm Thánh Nhan."},comm:[{ref:"Tv 19,6",text:"Chúng ta hãy vui mừng vì ơn Chúa cứu độ,\nphất cao cờ mừng danh Chúa chúng ta."},{ref:"Ep 5,2",text:"Đức Ki-tô đã yêu thương chúng ta,\nvà vì chúng ta,\nđã tự nộp mình làm hiến lễ dâng lên Thiên Chúa,\ntựa hương thơm ngào ngạt."}],reads:[{kind:"first",label:"Bài đọc",ref:"Ep 4,32 - 5,8",inc:"Hãy sống trong tình bác ái như Đức Ki-tô.",lead:"Bài trích thư của thánh Phao-lô tông đồ gửi tín hữu Ê-phê-xô.",paras:["⟦4,32⟧ Thưa anh em, anh em phải đối xử tốt với nhau, phải có lòng thương xót và biết tha thứ cho nhau, như Thiên Chúa đã tha thứ cho anh em trong Đức Ki-tô.","⟦5,1⟧ Vậy, anh em hãy bắt chước Thiên Chúa, vì anh em là con cái được Người yêu thương, ⟦2⟧ và hãy sống trong tình bác ái, như Đức Ki-tô đã yêu thương chúng ta, và vì chúng ta, đã tự nộp mình làm hiến lễ, làm hy lễ dâng lên Thiên Chúa tựa hương thơm ngào ngạt. ⟦3⟧ Chuyện gian dâm, mọi thứ ô uế hay tham lam, thì dù nói đến, anh em cũng phải tránh, như thế mới xứng đáng là những người trong dân thánh. ⟦4⟧ Đừng nói lời thô tục, nhảm nhí, cợt nhả : đó là những điều không nên ; trái lại, phải tạ ơn Thiên Chúa thì hơn. ⟦5⟧ Anh em phải biết rõ điều này : không một kẻ gian dâm, ô uế hay tham lam nào -mà tham lam cũng là thờ ngẫu tượng- được thừa hưởng cơ nghiệp trong Nước của Đức Ki-tô và của Thiên Chúa. ⟦6⟧ Đừng để ai lấy lời hão huyền mà lừa dối anh em, chính vì những điều đó mà cơn thịnh nộ của Thiên Chúa giáng xuống những kẻ không vâng phục. ⟦7⟧ Vậy anh em đừng thông đồng với họ. ⟦8⟧ Xưa anh em là bóng tối, nhưng bây giờ, trong Chúa, anh em lại là ánh sáng. Vậy anh em hãy ăn ở như con cái ánh sáng."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 1,1-2.3.4 và 6 (Đ. x. Ep 5,1)",refrain:"Chúng ta hãy bắt chước Thiên Chúa,\nnhư con cái được Người yêu thương.",stanzas:["⟦1⟧Phúc thay người chẳng nghe theo lời bọn ác nhân,\nchẳng bước vào đường quân tội lỗi,\nkhông nhập bọn với phường ngạo mạn kiêu căng,\n⟦2⟧nhưng vui thú với lề luật Chúa,\nnhẩm đi nhẩm lại suốt đêm ngày.","⟦3⟧Người ấy tựa cây trồng bên dòng nước,\ncứ đúng mùa là hoa quả trổ sinh,\ncành lá chẳng khi nào tàn tạ.\nNgười như thế làm chi cũng sẽ thành.","⟦4⟧Ác nhân đâu được vậy :\nchúng khác nào vỏ trấu gió thổi bay.\n⟦6⟧Vì Chúa hằng che chở nẻo đường người công chính,\ncòn đường lối ác nhân đưa tới chỗ diệt vong."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"x. Ga 17,17b.17a",text:"Ha-lê-lui-a. Ha-lê-lui-a. Lạy Chúa, Lời Chúa là sự thật ; xin Chúa lấy sự thật mà thánh hiến chúng con. Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Lc 13,10-17",inc:"Chẳng lẽ người con cháu ông Áp-ra-ham này lại không được cởi xiềng xích trong ngày sa-bát sao ?",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Lu-ca.",paras:["⟦10⟧ Khi ấy, Đức Giê-su giảng dạy trong một hội đường. ⟦11⟧ Ở đó, có một phụ nữ bị quỷ làm cho tàn tật đã mười tám năm. Lưng bà còng hẳn xuống và bà không thể nào đứng thẳng lên được. ⟦12⟧ Trông thấy bà, Đức Giê-su gọi lại và bảo : “Này bà, bà đã được giải thoát khỏi tật nguyền !” ⟦13⟧ Rồi Người đặt tay trên bà, tức khắc bà đứng thẳng lên được và tôn vinh Thiên Chúa.","⟦14⟧ Ông trưởng hội đường tức tối vì Đức Giê-su đã chữa bệnh vào ngày sa-bát. Ông lên tiếng nói với đám đông rằng : “Đã có sáu ngày để làm việc, thì đến mà xin chữa bệnh những ngày đó, đừng có đến vào ngày sa-bát !” ⟦15⟧ Chúa đáp : “Những kẻ đạo đức giả kia ! Thế ngày sa-bát, ai trong các người lại không cởi dây, dắt bò lừa rời máng cỏ đi uống nước ? ⟦16⟧ Còn bà này là con cháu ông Áp-ra-ham, bà ấy bị Xa-tan trói buộc đã mười tám năm nay, thì chẳng lẽ lại không được cởi xiềng xích đó trong ngày sa-bát sao ?” ⟦17⟧ Nghe Người nói thế, tất cả những kẻ chống đối Người lấy làm xấu hổ, còn toàn thể đám đông thì vui mừng vì mọi việc hiển hách Người đã thực hiện."]}]},{date:"2026-10-27",chip:"T3",dow:"Thứ Ba",title:"Thứ Ba Tuần XXX Thường Niên",color:"green",rank:"Lễ ngày thường · Năm chẵn",gloria:!1,credo:!1,ent:{ref:"Tv 104,3-4",text:"Tâm hồn những ai tìm kiếm Chúa,\nnào hoan hỷ.\nHãy tìm Chúa và sức mạnh của Người,\nchẳng khi ngừng tìm kiếm Thánh Nhan."},comm:[{ref:"Tv 19,6",text:"Chúng ta hãy vui mừng vì ơn Chúa cứu độ,\nphất cao cờ mừng danh Chúa chúng ta."},{ref:"Ep 5,2",text:"Đức Ki-tô đã yêu thương chúng ta,\nvà vì chúng ta,\nđã tự nộp mình làm hiến lễ dâng lên Thiên Chúa,\ntựa hương thơm ngào ngạt."}],reads:[{kind:"first",label:"Bài đọc",ref:"Ep 5,21-33",inc:"Mầu nhiệm này thật cao cả. Tôi muốn nói về Đức Ki-tô và Hội Thánh.",lead:"Bài trích thư của thánh Phao-lô tông đồ gửi tín hữu Ê-phê-xô.",paras:["⟦21⟧ Thưa anh em, vì lòng kính sợ Đức Ki-tô, anh em hãy tùng phục lẫn nhau. ⟦22⟧ Người làm vợ hãy tùng phục chồng như tùng phục Chúa, ⟦23⟧ vì chồng là đầu của vợ cũng như Đức Ki-tô là đầu của Hội Thánh, chính Người là Đấng cứu chuộc Hội Thánh, thân thể của Người. ⟦24⟧ Và như Hội Thánh tùng phục Đức Ki-tô thế nào, thì vợ cũng phải tùng phục chồng trong mọi sự như vậy.","⟦25⟧ Người làm chồng, hãy yêu thương vợ, như chính Đức Ki-tô yêu thương Hội Thánh và hiến mình vì Hội Thánh ; ⟦26⟧ như vậy, Người thánh hoá và thanh tẩy Hội Thánh bằng nước và lời hằng sống, ⟦27⟧ để trước mặt Người, có một Hội Thánh xinh đẹp lộng lẫy, không tỳ ố, không vết nhăn hoặc bất cứ một khuyết điểm nào, nhưng thánh thiện và tinh tuyền. ⟦28⟧ Cũng thế, chồng phải yêu vợ như yêu chính thân thể mình. Yêu vợ là yêu chính mình. ⟦29⟧ Quả vậy, có ai ghét thân xác mình bao giờ ; trái lại, người ta nuôi nấng và chăm sóc thân xác mình, cũng như Đức Ki-tô nuôi nấng và chăm sóc Hội Thánh, ⟦30⟧ vì chúng ta là bộ phận trong thân thể của Người. ⟦31⟧ Sách Thánh có lời chép rằng : Chính vì thế, người đàn ông sẽ lìa cha mẹ mà gắn bó với vợ mình, và cả hai sẽ thành một xương một thịt. ⟦32⟧ Mầu nhiệm này thật là cao cả. Tôi muốn nói về Đức Ki-tô và Hội Thánh. ⟦33⟧ Vậy mỗi người trong anh em hãy yêu vợ như chính mình, còn vợ thì hãy kính sợ chồng."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 127,1-2.3.4-5 (Đ. x. c.1a)",refrain:"Hạnh phúc thay những người kính sợ Chúa.",stanzas:["⟦1⟧Hạnh phúc thay bạn nào kính sợ Chúa,\năn ở theo đường lối của Người.\n⟦2⟧Công khó tay bạn làm, bạn được an hưởng,\nbạn quả là lắm phúc nhiều may.","⟦3⟧Hiền thê bạn trong cửa trong nhà\nkhác nào cây nho đầy hoa trái ;\nvà bầy con tựa những cây ô-liu mơn mởn,\nxúm xít tại bàn ăn.","⟦4⟧Đó chính là phúc lộc Chúa dành cho kẻ kính sợ Người.\n⟦5⟧Xin Chúa từ Xi-on xuống cho bạn muôn vàn ơn phúc.\nƯớc chi trong suốt cả cuộc đời\nbạn được thấy Giê-ru-sa-lem phồn thịnh."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"x. Mt 11,25",text:"Ha-lê-lui-a. Ha-lê-lui-a. Lạy Cha là Chúa Tể trời đất, con xin ngợi khen Cha, vì Cha đã mặc khải mầu nhiệm Nước Trời cho những người bé mọn. Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Lc 13,18-21",inc:"Hạt cải lớn lên và trở thành cây.",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Lu-ca.",paras:["⟦18⟧ Khi ấy, Đức Giê-su nói với dân chúng rằng : “Nước Thiên Chúa giống cái gì đây ? Tôi phải ví Nước ấy với cái gì ? ⟦19⟧ Nước Thiên Chúa giống như chuyện một hạt cải người nọ lấy gieo trong vườn mình. Nó lớn lên và trở thành cây, chim trời làm tổ trên cành được.”","⟦20⟧ Người lại nói : “Tôi phải ví Nước Thiên Chúa với cái gì ? ⟦21⟧ Nước Thiên Chúa giống như chuyện nắm men bà kia lấy vùi vào ba thúng bột, cho đến khi tất cả bột dậy men.”"]}]},{date:"2026-10-28",chip:"T4",dow:"Thứ Tư",title:"Thánh Si-môn và Thánh Giu-đa, Tông Đồ",color:"red",rank:"Lễ kính",gloria:!0,credo:!1,ent:{ref:"",text:"Đây là những vị thánh\nChúa đã lấy tình thương chân thành mà tuyển chọn,\nvà đã cho các ngài được vinh quang muôn thuở."},comm:[{ref:"Ga 14,23",text:"Chúa nói :\n“Ai yêu mến Thầy thì sẽ giữ lời Thầy.\nCha Thầy sẽ yêu mến người ấy.\nCha Thầy và Thầy sẽ đến và ở với người ấy.”"}],reads:[{kind:"first",label:"Bài đọc",ref:"Ep 2,19-22",inc:"Anh em đã được xây dựng trên nền móng là các Tông Đồ.",lead:"Bài trích thư của thánh Phao-lô tông đồ gửi tín hữu Ê-phê-xô.",paras:["⟦19⟧ Thưa anh em, anh em không còn phải là người xa lạ hay người tạm trú, nhưng là người đồng hương với các người thuộc dân thánh, và là người nhà của Thiên Chúa, ⟦20⟧ bởi đã được xây dựng trên nền móng là các Tông Đồ và ngôn sứ, còn đá tảng góc tường là chính Đức Ki-tô Giê-su. ⟦21⟧ Trong Người, toàn thể công trình xây dựng ăn khớp với nhau và vươn lên thành ngôi đền thánh trong Chúa. ⟦22⟧ Trong Người, cả anh em nữa, cũng được xây dựng cùng với những người khác thành ngôi nhà Thiên Chúa ngự, nhờ Thần Khí."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 18A,2-3.4-5ab (Đ. x. c.5a)",refrain:"Tiếng các ngài đã vang dội khắp hoàn cầu.",stanzas:["⟦2⟧Trời xanh tường thuật vinh quang Thiên Chúa,\nkhông trung loan báo việc tay Người làm.\n⟦3⟧Ngày qua mách bảo cho ngày tới,\nđêm này kể lại với đêm kia.","⟦4⟧Chẳng một lời một lẽ,\nchẳng nghe thấy âm thanh,\n⟦5ab⟧mà tiếng vang đã dội khắp hoàn cầu\nvà thông điệp loan đi tới chân trời góc biển."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"",text:"Ha-lê-lui-a. Ha-lê-lui-a. Lạy Thiên Chúa, chúng con xin ca ngợi hát mừng, tuyên xưng Ngài là Đức Chúa. Lạy Chúa, bậc Tông Đồ đồng thanh ca ngợi Chúa. Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Lc 6,12-19",inc:"Đức Giê-su chọn lấy mười hai ông và gọi là Tông Đồ.",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Lu-ca.",paras:["⟦12⟧ Trong những ngày ấy, Đức Giê-su đi ra núi cầu nguyện, và Người đã thức suốt đêm cầu nguyện cùng Thiên Chúa. ⟦13⟧ Đến sáng, Người kêu các môn đệ lại, chọn lấy mười hai ông và gọi là Tông Đồ. ⟦14⟧ Đó là ông Si-môn mà Người gọi là Phê-rô, rồi đến ông An-rê, anh của ông ; sau đó là các ông Gia-cô-bê, Gio-an, Phi-líp-phê, Ba-tô-lô-mê-ô, ⟦15⟧ Mát-thêu, Tô-ma, Gia-cô-bê con ông An-phê, Si-môn biệt danh là Nhiệt Thành, ⟦16⟧ Giu-đa con ông Gia-cô-bê, và Giu-đa Ít-ca-ri-ốt, người đã trở thành kẻ phản bội.","⟦17⟧ Đức Giê-su đi xuống cùng với các ông, Người dừng lại ở một chỗ đất bằng. Tại đó, đông đảo môn đệ của Người, và đoàn lũ dân chúng từ khắp miền Giu-đê, Giê-ru-sa-lem cũng như từ miền duyên hải Tia và Xi-đôn ⟦18⟧ đến để nghe Người giảng và để được chữa lành bệnh tật. Những kẻ bị các thần ô uế quấy nhiễu cũng được chữa lành. ⟦19⟧ Tất cả đám đông tìm cách sờ vào Người, vì có một năng lực tự nơi Người phát ra, chữa lành hết mọi người."]}]},{date:"2026-10-29",chip:"T5",dow:"Thứ Năm",title:"Thứ Năm Tuần XXX Thường Niên",color:"green",rank:"Lễ ngày thường · Năm chẵn",gloria:!1,credo:!1,ent:{ref:"Tv 104,3-4",text:"Tâm hồn những ai tìm kiếm Chúa,\nnào hoan hỷ.\nHãy tìm Chúa và sức mạnh của Người,\nchẳng khi ngừng tìm kiếm Thánh Nhan."},comm:[{ref:"Tv 19,6",text:"Chúng ta hãy vui mừng vì ơn Chúa cứu độ,\nphất cao cờ mừng danh Chúa chúng ta."},{ref:"Ep 5,2",text:"Đức Ki-tô đã yêu thương chúng ta,\nvà vì chúng ta,\nđã tự nộp mình làm hiến lễ dâng lên Thiên Chúa,\ntựa hương thơm ngào ngạt."}],reads:[{kind:"first",label:"Bài đọc",ref:"Ep 6,10-20",inc:"Anh em hãy nhận lấy toàn bộ binh giáp vũ khí của Thiên Chúa, để có thể đối phó và đứng vững.",lead:"Bài trích thư của thánh Phao-lô tông đồ gửi tín hữu Ê-phê-xô.",paras:["⟦10⟧ Thưa anh em, anh em hãy tìm sức mạnh trong Chúa và trong uy lực toàn năng của Người. ⟦11⟧ Hãy mang toàn bộ binh giáp vũ khí của Thiên Chúa, để có thể đứng vững trước những mưu chước của ma quỷ. ⟦12⟧ Vì chúng ta chiến đấu không phải với phàm nhân, nhưng là với những quyền lực thần thiêng, với những bậc thống trị thế giới tối tăm này, với những thần linh quái ác chốn trời cao. ⟦13⟧ Bởi đó, anh em hãy nhận lấy toàn bộ binh giáp vũ khí của Thiên Chúa ; như thế, anh em có thể vận dụng toàn lực để đối phó và đứng vững trong ngày đen tối.","⟦14⟧ Vậy hãy đứng vững : lưng thắt đai là chân lý, mình mặc áo giáp là sự công chính, ⟦15⟧ chân đi giày là lòng hăng say loan báo tin mừng bình an ; ⟦16⟧ hãy luôn cầm khiên mộc là đức tin, nhờ đó anh em sẽ có thể dập tắt mọi tên lửa của ác thần. ⟦17⟧ Sau cùng, hãy đội mũ chiến là ơn cứu độ và cầm gươm của Thần Khí ban cho, tức là Lời Thiên Chúa.","⟦18⟧ Theo Thần Khí hướng dẫn, anh em hãy dùng mọi lời kinh và mọi tiếng van nài mà cầu nguyện luôn mãi. Để được như vậy, anh em hãy chuyên cần tỉnh thức và cầu xin cho toàn thể dân thánh. ⟦19⟧ Anh em cũng hãy cầu xin cho tôi nữa, để khi tôi mở miệng nói, thì Thiên Chúa ban lời cho tôi, hầu tôi mạnh dạn loan báo mầu nhiệm của Tin Mừng ; ⟦20⟧ tôi là sứ giả của Tin Mừng này cả khi tôi đang bị xiềng xích. Anh em hãy cầu xin cho tôi để khi rao giảng Tin Mừng tôi nói năng mạnh dạn, như bổn phận tôi phải nói."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 143,1.2.9-10 (Đ. c.1a)",refrain:"Chúc tụng Chúa là núi đá cho tôi nương ẩn.",stanzas:["⟦1⟧Chúc tụng Chúa là núi đá cho tôi nương ẩn,\nlà Đấng dạy tôi nên người thiện chiến,\nluyện thành tay võ nghệ cao cường.","⟦2⟧Chúa là đồng minh, là đồn luỹ che chở,\nlà thành trì bảo vệ, là Đấng giải thoát tôi.\nChúa là khiên mộc cho tôi ẩn núp,\nNgười bắt chư dân quy phục quyền tôi.","⟦9⟧Lạy Chúa Trời, xin dâng Chúa một bài ca mới,\nthập huyền cầm, con gảy đôi cung.\n⟦10⟧Chính Ngài cho các vua thắng trận,\ncứu mạng Đa-vít, kẻ trung thần,\nkhỏi lưỡi gươm ác nghiệt."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"x. Lc 19,38 ; 2,14",text:"Ha-lê-lui-a. Ha-lê-lui-a. Chúc tụng Đức Vua, Đấng ngự đến nhân danh Chúa ! Bình an trên cõi trời cao, và vinh quang trên các tầng trời. Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Lc 13,31-35",inc:"Ngôn sứ mà chết ngoài thành Giê-ru-sa-lem thì không được.",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Lu-ca.",paras:["⟦31⟧ Khi ấy, tại Giê-ru-sa-lem, có mấy người Pha-ri-sêu đến thưa Đức Giê-su rằng : “Xin ông đi ra khỏi đây, vì vua Hê-rô-đê đang muốn giết ông !” ⟦32⟧ Người bảo họ : “Các ông hãy đi nói với con cáo ấy thế này : ‘Hôm nay và ngày mai tôi trừ quỷ và chữa lành bệnh tật, ngày thứ ba tôi hoàn tất. ⟦33⟧ Tuy nhiên, hôm nay, ngày mai và ngày mốt, tôi phải tiếp tục đi, vì một ngôn sứ mà chết ngoài thành Giê-ru-sa-lem thì không được.’","⟦34⟧ “Giê-ru-sa-lem, Giê-ru-sa-lem ! Ngươi giết các ngôn sứ và ném đá những kẻ được sai đến cùng ngươi ! Đã bao lần Ta muốn tập họp con cái ngươi lại, như gà mẹ tập họp gà con dưới cánh, mà các ngươi không chịu. ⟦35⟧ Thì này, nhà các ngươi sẽ bị bỏ mặc cho các ngươi. Mà Ta nói cho các ngươi hay : các ngươi sẽ không còn thấy Ta nữa cho đến thời các ngươi nói : Chúc tụng Đấng ngự đến nhân danh Đức Chúa !”"]}]},{date:"2026-10-30",chip:"T6",dow:"Thứ Sáu",title:"Thứ Sáu Tuần XXX Thường Niên",color:"green",rank:"Lễ ngày thường · Năm chẵn",gloria:!1,credo:!1,ent:{ref:"Tv 104,3-4",text:"Tâm hồn những ai tìm kiếm Chúa,\nnào hoan hỷ.\nHãy tìm Chúa và sức mạnh của Người,\nchẳng khi ngừng tìm kiếm Thánh Nhan."},comm:[{ref:"Tv 19,6",text:"Chúng ta hãy vui mừng vì ơn Chúa cứu độ,\nphất cao cờ mừng danh Chúa chúng ta."},{ref:"Ep 5,2",text:"Đức Ki-tô đã yêu thương chúng ta,\nvà vì chúng ta,\nđã tự nộp mình làm hiến lễ dâng lên Thiên Chúa,\ntựa hương thơm ngào ngạt."}],reads:[{kind:"first",label:"Bài đọc",ref:"Pl 1,1-11",inc:"Đấng đã thực hiện nơi anh em một công việc tốt lành, cũng sẽ đưa công việc đó tới chỗ hoàn thành cho đến ngày Đức Ki-tô quang lâm.",lead:"Khởi đầu thư của thánh Phao-lô tông đồ gửi tín hữu Phi-líp-phê.",paras:["⟦1⟧ Chúng tôi, Phao-lô và Ti-mô-thê, là những tôi tớ của Đức Ki-tô Giê-su, kính gửi mọi người trong dân thánh kết hợp với Đức Ki-tô Giê-su ở Phi-líp-phê, cùng kính gửi các vị giám quản và trợ tá. ⟦2⟧ Xin Thiên Chúa là Cha chúng ta và Chúa Giê-su Ki-tô ban cho anh em ân sủng và bình an.","⟦3⟧ Tôi cảm tạ Thiên Chúa của tôi, mỗi lần nhớ đến anh em. ⟦4⟧ Tôi luôn vui sướng mỗi khi cầu nguyện cho anh em hết thảy, ⟦5⟧ vì từ buổi đầu cho đến nay, anh em đã góp phần vào việc rao giảng Tin Mừng. ⟦6⟧ Tôi tin chắc rằng : Đấng đã bắt đầu thực hiện nơi anh em một công việc tốt lành như thế, cũng sẽ đưa công việc đó tới chỗ hoàn thành cho đến ngày Đức Ki-tô Giê-su quang lâm. ⟦7⟧ Tôi có những tâm tình như thế đối với tất cả anh em, đó là điều hợp lý, bởi vì tôi mang anh em trong lòng tôi. Khi tôi bị xiềng xích, cũng như lúc tôi bênh vực và củng cố Tin Mừng, anh em đều thông phần vào ân sủng tôi đã nhận được. ⟦8⟧ Có Thiên Chúa làm chứng cho tôi : tôi hết lòng yêu quý anh em tất cả, với tình thương của Đức Ki-tô Giê-su. ⟦9⟧ Điều tôi khẩn khoản nài xin, là cho lòng mến của anh em ngày thêm dồi dào, khiến anh em được ơn hiểu biết và tài trực giác siêu nhiên, ⟦10⟧ để nhận ra cái gì là tốt hơn. Tôi cũng xin cho anh em được nên tinh tuyền và không làm gì đáng trách, trong khi chờ đợi ngày Đức Ki-tô quang lâm. ⟦11⟧ Như thế, anh em sẽ đem lại hoa trái dồi dào là sống một đời công chính nhờ Đức Giê-su Ki-tô, để tôn vinh và ngợi khen Thiên Chúa."]},{kind:"psalm",label:"Đáp ca",ref:"Tv 110,1-2.3-4.5-6 (Đ. c.2a)",refrain:"Việc Chúa làm quả thật lớn lao.",stanzas:["⟦1⟧Tôi xin hết lòng cảm tạ Chúa,\ntrong cộng đoàn chính nhân, giữa lòng đại hội.\n⟦2⟧Việc Chúa làm quả thật lớn lao,\nngười mộ mến ra công tìm hiểu.","⟦3⟧Sự nghiệp Chúa oai phong hiển hách,\nđức công chính của Người tồn tại thiên thu.\n⟦4⟧Chúa đã truyền tưởng niệm những kỳ công của Người.\nChúa là Đấng từ bi nhân hậu.","⟦5⟧Ai kính sợ Người, Người ban phát của ăn ;\ngiao ước đã lập ra, muôn đời Người nhớ mãi.\n⟦6⟧Sức mạnh việc Người làm, Người cho dân thấy rõ,\nkhi tặng ban cho họ gia sản của chư dân."]},{kind:"acc",label:"Tung hô Tin Mừng",ref:"Ga 10,27",text:"Ha-lê-lui-a. Ha-lê-lui-a. Chúa nói : Chiên của tôi thì nghe tiếng tôi ; tôi biết chúng, và chúng theo tôi. Ha-lê-lui-a."},{kind:"gospel",label:"Tin Mừng",ref:"Lc 14,1-6",inc:"Ai trong các ông có đứa con trai hoặc có con bò sa xuống giếng, lại không kéo nó lên ngay, dù là ngày sa-bát ?",lead:"✠Tin Mừng Chúa Giê-su Ki-tô theo thánh Lu-ca.",paras:["⟦1⟧ Một ngày sa-bát kia, Đức Giê-su đến nhà một ông thủ lãnh nhóm Pha-ri-sêu để dùng bữa : họ cố dò xét Người. ⟦2⟧ Và kìa trước mặt Đức Giê-su, có một người mắc bệnh phù thũng. ⟦3⟧ Người lên tiếng nói với các nhà thông luật và những người Pha-ri-sêu : “Có được phép chữa bệnh ngày sa-bát hay không ?” ⟦4⟧ Nhưng họ làm thinh. Người đỡ lấy bệnh nhân, chữa khỏi và cho về. ⟦5⟧ Rồi Người nói với họ : “Ai trong các ông có đứa con trai hoặc có con bò sa xuống giếng, lại không kéo nó lên ngay, dù là ngày sa-bát ?” ⟦6⟧ Và họ không thể đáp lại những lời đó."]}]}],h="05:00";let i=19;try{const n=+localStorage.getItem("lit-fs");n>=15&&n<=28&&(i=n)}catch(n){}const t=n=>"d"+n.date.slice(8);let c=function(h){const i=new Date(h+252e5).toISOString().slice(0,10);let t=n.findIndex((n=>n.date===i));return t<0&&(t=i<n[0].date?0:n.length-1),t}(Date.now());const a=location.hash.slice(1),g=/^(?:s-)?(d\d\d)/.exec(a);if(g){const h=n.findIndex((n=>t(n)===g[1]));h>=0&&(c=h)}function l(n,h,i){const t=document.createElement(n);return h&&(t.className=h),null!=i&&(t.textContent=i),t}const e=/ +(?=(?:và|để|cho|vì|như|mà|với|trong|của|là|nhưng|hoặc|khi|thì|nơi|cùng|trên|dưới|khỏi|đến|tới|bởi|nhờ|theo|từ|giữa|đang)\s)/i,o=/(Đức Chúa Thánh Thần|Đức Chúa Cha|Đức Chúa Con|Thiên Chúa|Chúa Kitô|Giêsu Kitô|Giê-su Ki-tô|Đức Giêsu|Đức Giê-su|Đức Ki-tô|Chúa Cha|Thánh Thần|Thần Khí|Hội Thánh|Tin Mừng|Lời Chúa|Đức Maria|toàn năng|thương xót|chúng con|chúng ta|chúng tôi|anh chị em|anh em|đời đời|muôn đời|tầng trời|Nước Trời)/g,m=n=>n.replace(/ ([;:!?»])/g," $1").replace(/([«“]) /g,"$1 ").replace(o,(n=>n.replace(/ /g," ")));function r(n,h){return h.split(/(\S*\w-\w\S*)/).forEach(((h,i)=>{h&&(i%2?n.appendChild(l("span","nob",h)):n.append(h))})),n}function u(n,h,i){return m(h).split("\n").forEach(((h,t)=>{if(!h.trim())return;const c=l("span","ln"),a=/^⟦([^⟧]+)⟧\s?/.exec(h.trim());a&&(c.appendChild(l("sup",null,a[1])),h=h.trim().slice(a[0].length)),function(n){const h=[];n.replace(/([,;:!?.])\s+/g,"$1").split("").forEach((n=>n.split(e).forEach((n=>n&&h.push(n)))));const i=[];return h.forEach((n=>{const h=i[i.length-1];var t;i.length&&(h.length<14||n.length<9||((t=h).match(/\(/g)||[]).length>(t.match(/\)/g)||[]).length)?i[i.length-1]+=" "+n:i.push(n)})),i}(h.trim()).forEach(((n,h)=>{h&&c.append(" ");const a=function(n,h){const i=l("span",n.length<=(h?20:48)?"ph":"phl");let t=n,c="";if("phl"===i.className){const h=n.split(" ");let i=h.length-1;for
